server:
    port: 8080

mybatis-plus:
    configuration:
        # 默认不打印 SQL 到标准输出（避免参数值随日志泄露）。
        # 本地排查 SQL 时可临时改为 org.apache.ibatis.logging.stdout.StdOutImpl，
        # 或通过 mybatis-plus.configuration.log-impl 启动参数覆盖。
        log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
spring:
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        password: ${MYSQL_PASSWORD}
        type: com.alibaba.druid.pool.DruidDataSource
        url: jdbc:mysql://localhost:3306/coin-shell?useSSL=false&serverTimezone=Asia/Shanghai
        username: root
    data:
        redis:
            host: 127.0.0.1
            port: 6379
            timeout: 10s
            lettuce:
                pool:
                    min-idle: 1
                    max-active: 100
                    time-between-eviction-runs: 10000

        redisson:
            config: |
                singleServerConfig:
                  address: "redis://127.0.0.1:6379"
              

logging:
    level:
        com.xyxy.coinshell: debug


ai:
    service:
        url: http://localhost:8000
